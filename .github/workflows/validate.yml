name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check config project
        run: npm run typecheck:node

      - name: Validate topic data against schema
        run: npm run validate

      - name: Unit tests (src/lib)
        run: npm run test

      # `npm run build` = build:index && svelte-check && vite build, so this one
      # step regenerates the manifest, type-checks the frontend, and builds the
      # production bundle — the same gate that protects the auto-deployed site.
      - name: Build (data manifest, frontend type-check & production bundle)
        run: npm run build
