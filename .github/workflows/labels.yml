# Three small label chores GitHub can't express on its own (see docs/LABELS.md):
#   1. turn the issue forms' "Kind" dropdown into a real label,
#   2. flag a word list posted in simple (non-JSON) form as `Needs JSON 🧩`, and
#   3. keep at most one `priority: …` label on an issue.
name: Labels

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  kind:
    # Only on creation: re-running on every edit could strip a label a maintainer
    # set by hand, which is more surprising than a stale one after a body edit.
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Issue forms render each answer as "### <field label>" + the value, so the
            // dropdown's first word ("New", "Rework", …) identifies the choice. Bug and
            // Improvement are their own forms now and label themselves; they stay in the
            // map only so an older or hand-written body still gets its label.
            const KIND_LABELS = {
              New: "New 🆕",
              Rework: "Rework 🛠️",
              Language: "Language 🌐",
              Bug: "Bug 🐛",
              Improvement: "Improvement ⚙️",
            };

            const body = context.payload.issue.body || "";
            const sections = {};
            for (const block of body.split(/^###[ \t]+/m).slice(1)) {
              const nl = block.indexOf("\n");
              const heading = (nl === -1 ? block : block.slice(0, nl)).trim();
              // First occurrence wins: a "### Kind" pasted into a later free-text field
              // must not shadow the real dropdown, which always comes at a fixed spot.
              if (!(heading in sections)) {
                sections[heading] = nl === -1 ? "" : block.slice(nl + 1).trim();
              }
            }

            // "Kind of proposal" is the word-list form's dropdown — the only one left.
            // Plain "Kind" is kept for hand-written bodies that still use the old shape.
            const answer = sections["Kind of proposal"] ?? sections["Kind"] ?? "";
            const label = KIND_LABELS[answer.split(/\s+/)[0]];
            if (!label) {
              core.info(`No kind label for answer: ${JSON.stringify(answer)}`);
              return;
            }

            const existing = context.payload.issue.labels.map((l) => l.name);
            if (existing.includes(label)) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: [label],
            });
            core.info(`Added ${label}`);

  needs-json:
    # A word list posted in the simple (plain-text) form still has to be turned into JSON
    # by hand — flag it so someone can offer to do that (see docs/LABELS.md). Only on
    # creation, for the same reason as `kind`: never override a label a maintainer set later.
    if: "github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'List 📋')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // The word-list form's label is on the payload at creation, so this runs only
            // for lists. We look at the "Proposed entries" answer; a body without that
            // heading (a hand-written issue) falls back to the whole text.
            const body = context.payload.issue.body || "";
            const sections = {};
            for (const block of body.split(/^###[ \t]+/m).slice(1)) {
              const nl = block.indexOf("\n");
              const heading = (nl === -1 ? block : block.slice(0, nl)).trim();
              if (!(heading in sections)) {
                sections[heading] = nl === -1 ? "" : block.slice(nl + 1).trim();
              }
            }
            const entries = sections["Proposed entries"] || body;

            // A JSON entry line is a "…" string or a {…} object, optional trailing comma —
            // the shape of `data/topics/**`. The simple form's `de: …;` lines match none of
            // this, which is exactly what tells the two forms apart.
            const JSON_ENTRY = /^\s*(\{.*\}|"(?:[^"\\]|\\.)*")\s*,?\s*$/;
            const jsonLines = entries.split(/\r?\n/).filter((l) => JSON_ENTRY.test(l)).length;

            // 10 is skribbl's minimum list length, so any real JSON list clears it easily;
            // below it, treat the submission as the simple form that needs converting.
            if (jsonLines >= 10) {
              core.info(`Looks like JSON (${jsonLines} entry lines) — no label`);
              return;
            }

            const label = "Needs JSON 🧩";
            if (context.payload.issue.labels.map((l) => l.name).includes(label)) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: [label],
            });
            core.info(`Added ${label} (${jsonLines} JSON-looking lines)`);

  priority:
    # Removing a label fires `unlabeled`, never `labeled`, so this cannot loop.
    # Quoted because "priority: " contains a colon-space, which YAML would otherwise
    # read as a nested mapping.
    if: "github.event.action == 'labeled' && startsWith(github.event.label.name, 'priority: ')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Most severe first — everything below the highest present gets dropped.
            const ORDER = [
              "priority: critical",
              "priority: high",
              "priority: medium",
              "priority: low",
            ];

            const current = context.payload.issue.labels.map((l) => l.name);
            const present = ORDER.filter((p) => current.includes(p));
            if (present.length < 2) return;

            for (const surplus of present.slice(1)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                name: surplus,
              });
              core.info(`Removed ${surplus}, kept ${present[0]}`);
            }
