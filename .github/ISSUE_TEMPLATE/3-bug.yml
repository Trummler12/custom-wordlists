name: 🐛 Bug — something is broken
description: Something in the app doesn't work the way it should.
title: "💻 <short summary>"
labels: ["Code 💻", "Bug 🐛"]
body:
  - type: markdown
    attributes:
      value: |
        This one is about the **tool itself** — the site, the UI, the build. For anything about the *contents* of a word list, use the **Word list** or **Correction / small fix** template instead. For an idea rather than a fault, use **Improvement**.
  - type: textarea
    id: what
    attributes:
      label: What's happening
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How to trigger it. Screenshots welcome.
      placeholder: |
        1. Select the Pokémon topic
        2. Drag the fame slider to …
        3. The word count stays at 0
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Browser & device
      description: Helps when something renders or behaves differently.
      placeholder: e.g. Firefox 141 on Windows 11, or Safari on iPhone
    validations:
      required: false
