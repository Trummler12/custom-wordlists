# Keep blank issues on, so people can open plain discussion/question threads too.
blank_issues_enabled: true
contact_links:
  # A divider, of sorts: GitHub offers none, and without one the templates above and the
  # links below run into each other. Both fields are required and can't be blank, so the
  # separator carries a link worth following instead of a dead one.
  - name: 🌳
    url: https://impactful.ninja/best-charities-for-reforestation/
    about: 🌳🌳🌳🌳🌳🌳🌳🌳🌳🌳🌳🌳
  - name: 📖 Contribution guide
    url: https://github.com/Trummler12/custom-wordlists/blob/main/CONTRIBUTING.md
    about: How to propose word lists and fixes (Option A via issues, or Option B via a PR).
  - name: 💡 Worked example of a word-list proposal
    url: https://github.com/Trummler12/custom-wordlists/issues/17
    about: A full proposal, filled in end to end, in the format the template expects.
  - name: 🗺️ Topic tracker — what's covered and what's planned
    url: https://github.com/Trummler12/custom-wordlists/blob/main/docs/Topic-Progress.md
    about: Check here first — your topic may already be covered or in progress.
  - name: 🌍 Language roadmap
    url: https://github.com/Trummler12/custom-wordlists/blob/main/docs/Language-Roadmap.md
    about: Which languages are planned, and in what order.
