name: 📋 Word list — new or rework
description: Propose a new word list, or a rework or an added language for an existing one.
title: "📋 <Topic> — <short summary>"
labels: ["List 📋"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a list! For a **small fix** (one wrong/missing entry, a fame-group tweak, a missing translation) use the **Correction / small fix** template instead — this one is for whole lists.

        Discussion is welcome: others may spot mistakes or suggest better fame ordering in the thread before this becomes a pull request. See the [worked example](https://github.com/Trummler12/custom-wordlists/issues/17), and the [topic tracker](https://github.com/Trummler12/custom-wordlists/blob/main/docs/Topic-Progress.md) for what is already covered or in progress.
  - type: input
    id: topic
    attributes:
      label: Topic
      placeholder: e.g. South Park characters
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of proposal
      options:
        - New — a topic that isn't covered yet
        - Rework — an overhaul of an existing list
        - Language — adding or fixing a language on an existing list
    validations:
      required: true
  - type: textarea
    id: what-why
    attributes:
      label: What & why
      description: One or two sentences — which topic, why it fits, or (for a rework) what's wrong with the current list.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Links that back the entries (fandom wikis, official lists…). Optional but appreciated.
    validations:
      required: false
  - type: textarea
    id: entries
    attributes:
      label: Proposed entries
      description: >
        Two forms are welcome — pick either (full examples:
        **[simple](https://github.com/Trummler12/custom-wordlists/issues/17)** ·
        **[JSON](https://github.com/Trummler12/custom-wordlists/issues/26)**).


        **Simple:** names under **fame groups** (`### FG 1`, `### FG 2`, …), most iconic
        first (~10 in FG 1), one per line; add `de: …;` only where a language differs from
        English, and give the fullest name (`Eric Cartman`, not just `Cartman`).


        **JSON:** just the entries, grouped into fame arrays, one per line — a maintainer
        adds the wrapper and pastes it straight in. For a rework or a language, JSON is
        easiest: the current list already *is* JSON. The placeholder below shows both.
      placeholder: |
        ### FG 1
        Eric Cartman
        Stan Marsh
        en: Chef; de: Chefkoch;

        ### FG 2
        en: Santa; de: Weihnachtsmann;
        Satan

        --- OR directly as JSON: ---

        [
          {"short": "Cartman", "long": "Eric Cartman"},
          "Mr. Mackey"
        ],
        [
          {"en": "Santa", "de": "Weihnachtsmann"},
          "Satan"
        ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else — e.g. which entries deserve a short/long variant, or open questions.
    validations:
      required: false
