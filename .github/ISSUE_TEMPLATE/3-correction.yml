name: 🔧 Correction / small fix
description: A wrong or missing entry, a fame-group tweak, or a missing translation.
title: "🔧 <Topic> — <short summary>"
labels: ["Correction 🔧"]
body:
  - type: markdown
    attributes:
      value: |
        **Topic built from Wikidata?** Then fix a wrong or missing name on Wikidata itself; the topic's [coverage page](https://trummler12.github.io/custom-wordlists/coverage/) links every item. This form is for what Wikidata can't fix (an item that doesn't belong in the list, a wrong fame tier, entries that should be hidden) and for hand-written lists.

        For a whole new topic or a different query, use **Data source** instead.
  - type: input
    id: topic
    attributes:
      label: Which list / topic
      placeholder: e.g. South Park characters
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong / what to change
      description: Describe it in a sentence or two. Links to sources are welcome.
      placeholder: >
        "Chef" is listed with his real name as the long form, but "Chef" and "Jerome
        McElroy" are known very differently — they should be separate entries in
        different fame groups.
    validations:
      required: true
