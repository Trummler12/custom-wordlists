<!-- A word list, tapering: three chips of the kind the output panel is made of,
     narrowing the way the fame ruler does as it goes deeper into a topic.

     One colour at three opacities rather than the theme's own chip colours: a
     tab strip is light or dark and the icon cannot ask which, while the accent
     blue holds up against both. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect x="4" y="6" width="24" height="6" rx="3" fill="#4a7cf6" />
  <rect x="4" y="14" width="18" height="6" rx="3" fill="#4a7cf6" opacity="0.72" />
  <rect x="4" y="22" width="12" height="6" rx="3" fill="#4a7cf6" opacity="0.45" />
</svg>
